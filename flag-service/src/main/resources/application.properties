# ===========================================================================
# Flag Service — the only configuration file.
#
# There are no profile-specific files. The same configuration is used for
# local testing and for the cloud deployment; the only thing that changes is
# where the two connection URLs point.
#
# Every environment-specific value is read from an environment variable, and
# each one has a localhost default, which is where the containers from
# docker-compose.yml listen. So the service starts during local development
# with no configuration at all.
#
# To run against MongoDB Atlas and Upstash Redis — locally or in the cloud —
# export MONGODB_URI and REDIS_URL. Nothing else changes:
#
#   export JWT_SECRET="<32+ byte random string>"
#   export MONGODB_URI="mongodb+srv://user:pass@cluster0.xxxxx.mongodb.net/ffproject?retryWrites=true&w=majority"
#   export REDIS_URL="rediss://default:password@host:port"
#   ./mvnw spring-boot:run
# ===========================================================================

# --- HTTP ------------------------------------------------------------------
# SERVER_PORT wins when set (docker-compose pins 8001), otherwise fall back to
# Render's PORT (which defaults to 10000 and is what a Render web service
# requires the app to bind), and 8001 as the plain local default.
server.port=${SERVER_PORT:${PORT:8001}}

# --- Authentication --------------------------------------------------------
# jwt.secret has no default on purpose: startup fails fast if it is missing.
# expiry-seconds must be between 60 and 86400 (validated at startup).
jwt.secret=${JWT_SECRET}
jwt.expiry-seconds=${JWT_EXPIRY_SECONDS:3600}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin}

# --- MongoDB ---------------------------------------------------------------
# Include the database name in the URI, for example .../ffproject?retryWrites=true&w=majority
# Without it the driver falls back to a database named "test".
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ffproject}
spring.data.mongodb.auto-index-creation=true

# --- Redis -----------------------------------------------------------------
# Use the rediss:// scheme for TLS. Spring Boot enables SSL automatically when
# the URL starts with rediss://, so there is no separate SSL flag to keep in
# sync between environments.
# The key must be spring.data.redis.* — the older spring.redis.* names are
# deprecated and are NOT bound by Spring Boot 3.2, which silently falls back to
# localhost:6379.
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

# --- OpenAPI / Swagger UI --------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- Logging ---------------------------------------------------------------
logging.level.com.ffproject=INFO
